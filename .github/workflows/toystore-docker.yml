name: Toystore cicd
on:
  push:
    branches: [ "main" ]
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install frontend dependencies
      run: cd ecommerce-frontend && npm install
    - name: Run frontend tests
      run: cd ecommerce-frontend && npm test 
    - name: Install backend dependencies
      run: cd ecommerce-backend && npm install
    - name: Run backend tests
      run: cd ecommerce-backend && npm test 


  Gitleaks-setup:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
        
      - name: Install GitLeaks
      - uses: gitleaks/gitleaks-action@v2

      - name: Gitleaks Code Scan
        run: |
            gitleaks detect --source ./ecommerce-frontend --exit-code 1
            gitleaks detect --source ./ecommerce-backend --exit-code 1



  trivy_fs_scan:
    runs-on: ubuntu-latest
    needs:  Gitleaks-setup

    steps:
    - uses: actions/checkout@v4
    - name: Trivy Installation
      run: |
        sudo apt-get install wget gnupg
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update -y
        sudo apt-get install trivy -y
        
    - name: Trivy FS Scan
      run: trivy fs --format table -o fs-report.json .
      
   
     
  


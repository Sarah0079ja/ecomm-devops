  build-and-push-frontend:
    runs-on: ubuntu-latest
    needs: security-check

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-options: image=moby/buildkit:latest
          
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./ecommerce-frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/ecommerce-frontend:latest
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/ecommerce-frontend:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/ecommerce-frontend:buildcache,mode=max      
      
  build-and-push-backend:
    runs-on: ubuntu-latest
    needs: security-check
    
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./ecommerce-backend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/ecommerce-backend:latest
 
  trivy_image_scan:
    runs-on: ubuntu-latest
    needs:   [build-and-push-frontend, build-and-push-backend]
    
    steps:
      - name: Checkout code
        Uses: actions/checkout@v4
      
      - name: Run Trivy image scan for ecommerce-backend 
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ecommerce-backend:latest
          format: json
          output: trivy-report.json
          exit-code: '0'
          ignore-unfixed: true 
          vuln-type: os, library 
          severity: CRITICAL,HIGH 

      - name: Run Trivy image scan for ecommerce-frontend 
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ecommerce-frontend:latest
          format: json
          output: trivy-report.json
          exit-code: '0'
          ignore-unfixed: true 
          vuln-type: os, library 
          severity: CRITICAL,HIGH 
                    

